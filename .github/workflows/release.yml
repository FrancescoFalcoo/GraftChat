name: Release

# Push a tag like v0.2.0 to publish a GitHub release with a zip that already contains the
# built interface (web/dist): people who download it need Python only, not Node.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Package the source with the built interface
        run: |
          name="graftchat-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="$name/" HEAD | tar -x
          cp -r web/dist "$name/web/dist"
          zip -qr "$name.zip" "$name"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "graftchat-${GITHUB_REF_NAME}.zip" --generate-notes
