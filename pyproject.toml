[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "graftchat"
version = "0.1.0"
description = "Anchored branching chat for LLMs: graft side conversations onto any passage of an answer, then bring back only what matters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "watchfiles>=1"]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
