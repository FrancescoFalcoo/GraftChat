[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graftchat"
version = "0.1.0"
description = "Anchored branching chat for LLMs: graft side conversations onto any passage of an answer, then bring back only what matters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Francesco Falco" }]
keywords = ["llm", "chat", "branching", "context-management"]
dependencies = []

[project.urls]
Repository = "https://github.com/FrancescoFalcoo/GraftChat"

[project.optional-dependencies]
# Backend (api/): core/ itself has no dependencies.
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pypdf>=5"]
dev = ["pytest>=8", "watchfiles>=1", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pypdf>=5"]

[tool.setuptools.packages.find]
include = ["core*", "api*"]

[tool.setuptools.package-data]
api = ["migrations/*.sql"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
